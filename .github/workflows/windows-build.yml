name: Build Windows portable application
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Syntax and unit / GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q main.py zee tests
          python -m pytest -q --junitxml=windows-tests.xml
      - name: Validate bundled requested starter map
        run: python -c "from zee.regionmap import load; load('assets/region_map.json.gz')"
      - name: Build portable EXE
        run: python -m PyInstaller --clean --noconfirm ZeeNetworkMonitor.spec
      - name: Frozen GUI startup and shutdown smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'zee-smoke'
          $exe = Join-Path $PWD 'dist/ZeeNetworkMonitor/ZeeNetworkMonitor.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', '--data-dir', $data) -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Frozen app timed out' }
          if ($process.ExitCode -ne 0) { throw 'Frozen app returned an error' }
          if (-not (Test-Path (Join-Path $data 'smoke-ok.txt'))) { throw 'Smoke success marker missing' }
      - name: Assemble portable ZIP with Windows test report
        run: python scripts/package_release.py
      - name: Upload downloadable portable package
        uses: actions/upload-artifact@v4
        with:
          name: ZeeNetworkMonitor-Windows-x64
          path: ZeeNetworkMonitor-Windows-x64.zip
          retention-days: 30
      - name: Upload test and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          path: |
            windows-tests.xml
            build/ZeeNetworkMonitor/warn-ZeeNetworkMonitor.txt
            ${{ runner.temp }}/zee-smoke/diagnostic.log
          if-no-files-found: ignore
