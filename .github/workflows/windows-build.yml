name: Build and test monitoring-only Windows package
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'professional/**']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Syntax, unit, security and GUI integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q main.py zee tests admin
          if ($LASTEXITCODE -ne 0) { throw "Syntax checks failed" }
          python -m pytest -q --junitxml=windows-tests.xml
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
          python -c "from zee.regionmap import load; load('assets/region_map.json.gz')"
          if ($LASTEXITCODE -ne 0) { throw "Map asset check failed" }
      - name: Record synthetic scheduling, UI and cleanup measurements
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/benchmark_phase3.py phase3-benchmark-windows.json
          if ($LASTEXITCODE -ne 0) { throw "Scheduling benchmark failed" }
          python scripts/benchmark_phase10.py phase10-benchmark-windows.json
          if ($LASTEXITCODE -ne 0) { throw "Pilot benchmark failed" }
      - name: Build monitoring application only
        run: python -m PyInstaller --clean --noconfirm ZeeNetworkMonitor.spec
      - name: Verify existing owner-preview startup and preserved enforcement
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/verify_monitoring_runtime.py
      - name: Verify frozen field-pilot panel and safe defaults
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/verify_pilot_runtime.py
      - name: Package and audit portable runtime contents
        run: python scripts/package_release.py
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          & $iscc installer/ZeeNetworkMonitor.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Test install, shortcuts, launch, upgrade data preservation and uninstall
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $setup = Join-Path $PWD 'release/ZeeNetworkMonitor-Setup-Windows-v0.5.2.exe'
          $install = Join-Path $env:LOCALAPPDATA 'Programs/ZeeNetworkMonitor'
          $data = Join-Path $env:LOCALAPPDATA 'ZeeNetworkMonitor'
          New-Item -ItemType Directory -Force $data | Out-Null
          'preserve' | Set-Content (Join-Path $data 'upgrade-test.txt')
          'old activation fixture' | Set-Content (Join-Path $data 'license.json')
          $p = Start-Process $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installation failed' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Zee Network Monitor.lnk'))) { throw 'Desktop shortcut missing' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Zee Network Monitor/Zee Network Monitor.lnk'))) { throw 'Start Menu shortcut missing' }
          $p = Start-Process (Join-Path $install 'ZeeNetworkMonitor.exe') -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Installed app timed out' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path (Join-Path $data 'smoke-ok.txt'))) { throw 'Installed launch failed' }
          $p = Start-Process $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path (Join-Path $data 'monitor.sqlite3'))) { throw 'Upgrade failed' }
          $p = Start-Process (Join-Path $install 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (-not (Test-Path (Join-Path $data 'upgrade-test.txt')) -or -not (Test-Path (Join-Path $data 'monitor.sqlite3'))) { throw 'Uninstall removed user data' }
          if ((Get-Content (Join-Path $data 'license.json')).Trim() -ne 'old activation fixture') { throw 'Old activation record changed' }
          if (Test-Path (Join-Path $install 'ZeeNetworkMonitor.exe')) { throw 'Uninstall left executable' }
          'Install, desktop/Start Menu, installed launch, upgrade and uninstall passed on Windows Server 2022; physical Windows 10 untested.' | Set-Content release/INSTALLER_TEST_REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZeeNetworkMonitor-Setup-Windows
          path: |
            release/ZeeNetworkMonitor-Setup-Windows-v0.5.2.exe
            release/INSTALLER_TEST_REPORT.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ZeeNetworkMonitor-Portable-Windows
          path: release/ZeeNetworkMonitor-Portable-Windows-v0.5.2.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          path: |
            windows-tests.xml
            phase3-benchmark-windows.json
            phase10-benchmark-windows.json
            build/ZeeNetworkMonitor/warn-ZeeNetworkMonitor.txt
            ${{ runner.temp }}/zee-smoke/diagnostic.log
            release/INSTALLER_TEST_REPORT.txt
          if-no-files-found: ignore
